<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Aucun script inline ni requête réseau possible (connect-src 'none') : tout, polices comprises, vient du site lui-même. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV modulaire</title>
  <link rel="stylesheet" href="style.css?v=20261124f">
</head>
<body>
  <aside class="sidebar">
    <h1 class="brand">CV modulaire</h1>
    <p class="hint" id="notice" role="status" aria-live="polite"></p>

    <div class="block">
      <p class="label" id="label-language"></p>
      <div class="segmented" role="group" aria-labelledby="label-language">
        <button type="button" data-lang="fr" aria-pressed="true">Français</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>

    <div class="block">
      <p class="label" id="label-profiles"></p>
      <div class="chips" id="profiles"></div>
      <div class="config-save">
        <input type="text" id="config-name" autocomplete="off">
        <button type="button" class="chip" id="config-save"></button>
      </div>
      <button type="button" class="chip" id="profiles-restore" hidden></button>
      <p class="hint" id="profiles-hint"></p>
    </div>

    <details class="block fold">
      <summary class="label" id="label-configs"></summary>
      <p class="hint" id="configs-hint"></p>
      <div class="options">
        <button type="button" class="chip" id="backup-export"></button>
        <button type="button" class="chip" id="backup-import"></button>
        <input type="file" id="backup-file" accept="application/json,.json" hidden>
      </div>
      <p class="hint" id="backup-note"></p>
      <p class="hint" id="save-status" role="status"></p>
    </details>

    <details class="block fold">
      <summary class="label" id="label-edit"></summary>
      <p class="hint" id="edit-hint"></p>
      <button type="button" class="chip" id="reset-texts"></button>
    </details>

    <div id="controls"></div>

    <div class="export">
      <button type="button" class="primary" id="export-btn"></button>
      <p class="hint" id="export-hint"></p>
      <p class="error" id="fit-warning" role="status"></p>
    </div>
  </aside>

  <main class="preview">
    <div id="a4-probe" aria-hidden="true"></div>
    <article id="cv" class="page"></article>
  </main>

  <script src="data.js?v=20261124f"></script>
  <script src="i18n.js?v=20261124f"></script>
  <script src="validate.js?v=20261124f"></script>
  <script src="app.js?v=20261124f"></script>
</body>
</html>
